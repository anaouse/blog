# 公共配置：nginx 的端口映射按部署模式拆分到独立文件，避免互相干扰。
#   ./scripts/deploy.sh standalone（默认）→ docker-compose.standalone.yml（占用宿主 80/443）
#   ./scripts/deploy.sh coexist        → docker-compose.coexist.yml（只监听 127.0.0.1:COEXIST_HTTP_PORT）
services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    volumes:
      # 证书与 acme-challenge 存独立 volume，重建 nginx 镜像不影响证书
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    build:
      context: .
      dockerfile: certbot/Dockerfile
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    environment:
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    depends_on:
      - nginx
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - db
    restart: unless-stopped
    volumes:
      - ./backend/articles:/articles
    # 不映射端口到宿主机，仅容器网络内由 nginx 反代访问

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # 不映射端口到宿主机，仅容器网络内可达

volumes:
  pgdata:
  certbot-etc:
  certbot-www:
